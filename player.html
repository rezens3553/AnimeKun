<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Telegram Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .player-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 50px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-btn {
            height: 50px;
            width: 100%;
            background-color: #ff5252;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <iframe id="video-frame" src="" allowfullscreen allow="autoplay *; fullscreen *; encrypted-media *"></iframe>
    </div>

    <button class="close-btn" onclick="Telegram.WebApp.close()">Закрыть плеер</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); // Разворачивает Mini App на весь экран телефона

        // Считываем параметры, которые передал бот
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || '';
        const episode = urlParams.get('ep') || '1';
        const voice = urlParams.get('voice') || '';

        const iframe = document.getElementById('video-frame');
        
        // Ссылка на базу Kodik, которая сама найдет аниме, нужную серию и озвучку прямо внутри Telegram
        if (title) {
            iframe.src = `https://kodik.cc/search?title=${encodeURIComponent(title)}&episode=${episode}&translation_type=${encodeURIComponent(voice)}`;
        } else {
            document.body.innerHTML = "<h3 style='color:white; text-align:center; padding-top:50px;'>Ошибка: аниме не выбрано</h3>";
        }
    </script>
</body>
</html>
