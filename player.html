<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Clean Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h2 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .info {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .player-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            display: block;
            outline: none;
        }
        .close-btn {
            margin-top: 15px;
            width: 100%;
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="anime-title">Загрузка...</h2>
        <div class="info" id="anime-info">Серия: -, Озвучка: -</div>
        
        <div class="player-box">
            <!-- Родной HTML5 плеер: без скриптов, баннеров и рекламы -->
            <video id="native-player" controls playsinline>
                Ваш браузер не поддерживает видео.
            </video>
        </div>

        <button class="close-btn" onclick="Telegram.WebApp.close()">Закрыть плеер</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Считываем параметры из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Аниме';
        const episode = urlParams.get('ep') || '1';
        const voice = urlParams.get('voice') || 'Anilibria';
        
        // Прямая ссылка на видеофайл (.mp4). Сюда можно подставить ссылку на свой файл или сервер
        const videoUrl = urlParams.get('url') || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

        document.getElementById('anime-title').innerText = title;
        document.getElementById('anime-info').innerText = `Серия: ${episode} серия | Озвучка: ${voice}`;

        // Задаем источник для чистого плеера
        const player = document.getElementById('native-player');
        player.src = videoUrl;
    </script>
</body>
</html>
