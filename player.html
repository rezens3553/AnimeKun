<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Auto Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 800px; }
        h2 { font-size: 16px; margin-bottom: 4px; }
        .info { color: #888; font-size: 13px; margin-bottom: 12px; }
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .close-btn {
            margin-top: 15px;
            width: 100%;
            background-color: #ff5252;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="anime-title">Загрузка...</h2>
        <div class="info" id="anime-info">Серия: -, Озвучка: -</div>
        
        <div class="player-container">
            <!-- Встроенный фрейм плеера, который автоматически подставит поиск по названию, серии и озвучке -->
            <iframe id="kodik-player" src="" allowfullscreen allow="autoplay *; fullscreen *"></iframe>
        </div>

        <button class="close-btn" onclick="Telegram.WebApp.close()">Закрыть плеер</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Получаем параметры, которые передал бот (название, серия, выбранная озвучка)
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Аниме';
        const episode = urlParams.get('ep') || '1';
        const voice = urlParams.get('voice') || 'Anilibria';

        // Выводим текст в шапку
        document.getElementById('anime-title').innerText = title;
        document.getElementById('anime-info').innerText = `Серия: ${episode} | Озвучка: ${voice}`;

        // Формируем ссылку для автоматического поиска в базе по названию, номеру серии и озвучке
        const iframe = document.getElementById('kodik-player');
        const encodedTitle = encodeURIComponent(title);
        
        // Эта ссылка сама найдет нужное аниме в базе и включит нужную озвучку и серию
        iframe.src = `https://kodik.cc/search?title=${encodedTitle}&episode=${episode}&translation_type=${encodeURIComponent(voice)}`;
    </script>
</body>
</html>
