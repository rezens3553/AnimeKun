<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Anime Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header {
            margin-bottom: 12px;
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        .info {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }
        /* Кастомный контейнер плеера */
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Заглушка, если видео не найдено */
        .no-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #181818;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
        .no-video span {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .controls-panel {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background-color: #2b2b2b;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #3b3b3b;
        }
        .btn-danger {
            background-color: #e50914;
        }
        .btn-danger:hover {
            background-color: #f40612;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2 id="anime-title">Загрузка...</h2>
            <div class="info" id="anime-info">Серия: -, Озвучка: -</div>
        </div>
        
        <div class="player-container" id="player-box">
            <!-- HTML5 видеоплеер -->
            <video id="custom-video" controls playsinline style="display: none;"></video>
            
            <!-- Заглушка, если ссылка на видео не передана -->
            <div id="no-video-stub" class="no-video">
                <span>📭</span>
                <p>Видео для этой серии пока не загружено в базу плеера.</p>
                <p style="font-size: 11px; color: #555; margin-top: 5px;">Передайте прямую ссылку через параметр ?url=</p>
            </div>
        </div>

        <div class="controls-panel">
            <button class="btn" onclick="skipTime(-10)">⏪ -10 сек</button>
            <button class="btn" onclick="skipTime(10)">+10 сек ⏩</button>
            <button class="btn btn-danger" onclick="Telegram.WebApp.close()">Закрыть</button>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Считываем параметры из ссылки, которые передал бот
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'Аниме';
        const episode = urlParams.get('ep') || '1';
        const voice = urlParams.get('voice') || 'Anilibria';
        const videoUrl = urlParams.get('url'); // Прямая ссылка на .mp4 файл (если есть)

        // Заполняем тексты
        document.getElementById('anime-title').innerText = title;
        document.getElementById('anime-info').innerText = `Серия: ${episode} | Озвучка: ${voice}`;

        const videoElement = document.getElementById('custom-video');
        const stubElement = document.getElementById('no-video-stub');

        // Если бот передал прямую ссылку на видео — включаем плеер, иначе показываем заглушку
        if (videoUrl) {
            videoElement.src = videoUrl;
            videoElement.style.display = 'block';
            stubElement.style.display = 'none';
        } else {
            // Тестовая ссылка для примера (можешь удалить, если не нужна)
            // videoElement.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
            // videoElement.style.display = 'block';
            // stubElement.style.display = 'none';
        }

        // Кастомная функция быстрой перемотки
        function skipTime(seconds) {
            if (videoElement) {
                videoElement.currentTime += seconds;
            }
        }
    </script>
</body>
</html>
