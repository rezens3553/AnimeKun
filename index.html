<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }
        .card-title {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading {
            text-align: center;
            color: #888;
            grid-column: span 2;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <input type="text" class="search-box" id="searchInput" placeholder="Поиск аниме..." oninput="searchAnime()">
    <div class="section-title" id="heading">🔥 Популярные новинки</div>
    <div class="grid" id="animeGrid">
        <div class="loading">Загрузка каталога...</div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const API_BASE = "https://shikimori.one";

        async function loadPopularAnime() {
            try {
                const response = await fetch(`${API_BASE}/api/animes?limit=12&order=popularity`);
                const data = await response.json();
                renderAnime(data);
            } catch (e) {
                document.getElementById('animeGrid').innerHTML = '<div class="loading">Ошибка загрузки данных.</div>';
            }
        }

        async function searchAnime() {
            const query = document.getElementById('searchInput').value.trim();
            const heading = document.getElementById('heading');
            
            if (!query) {
                heading.innerText = "🔥 Популярные новинки";
                loadPopularAnime();
                return;
            }
            
            heading.innerText = `🔍 Поиск: ${query}`;
            try {
                const response = await fetch(`${API_BASE}/api/animes?search=${encodeURIComponent(query)}&limit=12`);
                const data = await response.json();
                renderAnime(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderAnime(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<div class="loading">Ничего не найдено</div>';
                return;
            }

            list.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'card';
                const poster = anime.image ? API_BASE + anime.image.original : '';
                const title = anime.russian || anime.name;
                
                card.innerHTML = `
                    <img src="${poster}" alt="${title}">
                    <div class="card-title">${title}</div>
                `;
                grid.appendChild(card);
            });
        }

        loadPopularAnime();
    </script>
</body>
</html>
