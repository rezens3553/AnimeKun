<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Каталог</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .anime-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            border: 1px solid #333;
            transition: 0.2s;
        }
        .anime-card:hover {
            border-color: #555;
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .anime-info {
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Выберете аниме</h1>

    <!-- Список твоих аниме-карточек (можешь добавлять свои по аналогии) -->
    <div class="anime-card" onclick="selectAnime('Стальной алхимик: Братство', 64, '9.1', 'https://via.placeholder.com/300x450')">
        <div class="anime-title">🎬 Стальной алхимик: Братство</div>
        <div class="anime-info">Серий: 64 | Рейтинг: 9.1</div>
    </div>

    <div class="anime-card" onclick="selectAnime('Клинок, рассекающий демонов', 26, '8.7', 'https://via.placeholder.com/300x450')">
        <div class="anime-title">🎬 Клинок, рассекающий демонов</div>
        <div class="anime-info">Серий: 26 | Рейтинг: 8.7</div>
    </div>

    <script>
        // Инициализация WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function selectAnime(title, episodes, rating, cover) {
            // Формируем объект с данными, который ждет твой бот в main.py
            const animeData = {
                title: title,
                episodes: episodes,
                rating: rating,
                cover: cover
            };

            // Отправляем данные боту в формате JSON строки
            Telegram.WebApp.sendData(JSON.stringify(animeData));
            
            // Закрываем Mini App, чтобы вернуть пользователя в чат с ботом
            Telegram.WebApp.close();
        }
    </script>

</body>
</html>
