<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 90px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
            color: #0088cc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background-color: #1e1e22;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid #2a2a30;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-score {
            font-size: 12px;
            color: #ffca28;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            background-color: #1e1e22;
            width: 100%;
            max-height: 85vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .modal-details {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 16px;
        }

        .watch-btn {
            width: 100%;
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎬 Каталог Аниме</h1>
    <div class="grid" id="anime-list"></div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-details" id="modal-details"></div>
            <button class="watch-btn" onclick="watchAnime()">СМОТРЕТЬ АНИМЕ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // УКАЖИТЕ ЮЗЕРНЕЙМ ВАШЕГО БОТА БЕЗ ЗНАКА @
        const BOT_USERNAME = "AnimeKunn_bot"; 

        let selectedAnime = null;

        async function loadAnime() {
            try {
                const response = await fetch("https://shikimori.one/api/animes?limit=20&order=popularity");
                const data = await response.json();
                
                const container = document.getElementById("anime-list");
                container.innerHTML = "";

                data.forEach(anime => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.onclick = () => openModal(anime);

                    const title = anime.russian || anime.name;
                    const poster = "https://shikimori.one" + anime.image.original;

                    card.innerHTML = `
                        <img src="${poster}" alt="${title}">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                            <div class="card-score">⭐ ${anime.score}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки данных:", e);
            }
        }

        function openModal(anime) {
            selectedAnime = anime;
            document.getElementById("modal-title").innerText = anime.russian || anime.name;
            document.getElementById("modal-details").innerText = `Эпизоды: ${anime.episodes || anime.episodes_aired || 12} | Рейтинг: ⭐ ${anime.score}`;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function watchAnime() {
            if (!selectedAnime) return;
            // Переход в чат бота с передачей ID аниме
            tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=watch_${selectedAnime.id}`);
            tg.close();
        }

        loadAnime();
    </script>
</body>
</html>
