<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Каталог</title>
    <!-- Подключаем скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; cursor: pointer; border: 1px solid #333; }
        .card h3 { margin: 0 0 5px 0; color: #ff5252; }
        .btn { background: #ff5252; color: #white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 15px; }
        #manga-info { display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Список каталога манги -->
    <div id="catalog">
        <h2>📚 Каталог манги</h2>
        
        <!-- Карточка первой манги -->
        <div class="card" onclick="openManga('berserk', 'Берсерк', 'Оценка: 9.8 | Глав: 364\n\nИстория о черном мечнике Гатсе, борющемся со своей судьбой в мрачном фэнтезийном мире.')">
            <h3>Берсерк</h3>
            <p style="color: #aaa; font-size: 14px; margin: 0;">⭐ 9.8 | Глав: 364</p>
        </div>

        <!-- Можешь добавлять сюда еще карточки по аналогии -->
    </div>

    <!-- ЭКРАН 2: Информация о выбранной манге -->
    <div id="manga-info">
        <h2 id="title" style="color: #ff5252;">Название</h2>
        <p id="details" style="line-height: 1.5; color: #ddd; white-space: pre-line;">Информация...</p>
        
        <!-- Кнопка отправляет данные в бота и закрывает Mini App -->
        <button class="btn" onclick="selectMangaInBot()">Выбрать главу в чате</button>
        <button style="background: transparent; color: #888; border: none; width: 100%; margin-top: 10px; padding: 10px; cursor: pointer;" onclick="goBack()">⬅️ Назад к каталогу</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        let currentMangaSlug = '';

        function openManga(slug, name, infoText) {
            currentMangaSlug = slug;
            document.getElementById('catalog').style.display = 'none';
            document.getElementById('manga-info').style.display = 'block';
            
            document.getElementById('title').innerText = name;
            document.getElementById('details').innerText = infoText;
        }

        function goBack() {
            document.getElementById('manga-info').style.display = 'none';
            document.getElementById('catalog').style.display = 'block';
        }

        function selectMangaInBot() {
            // Упаковываем данные и отправляем их обратно в Telegram-бот
            const data = JSON.stringify({ action: 'choose_chapter', manga: currentMangaSlug });
            Telegram.WebApp.sendData(data);
        }
    </script>
</body>
</html>
