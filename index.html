<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKun Manga Reader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.95);
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
            border-bottom: 1px solid #222;
            z-index: 100;
        }
        #reader-container {
            width: 100%;
            max-width: 800px;
            margin-top: 45px; /* отступ под шапку */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Страницы манги идут друг за другом */
        .manga-page {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 2px;
        }
        .loading {
            padding: 50px;
            text-align: center;
            color: #888;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header" id="chapter-title">Загрузка главы...</div>

    <div id="reader-container">
        <div class="loading" id="status">Загружаем страницы манги...</div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const mangaSlug = urlParams.get('manga') || 'berserk';
        const chapterNum = urlParams.get('ch') || '1';

        document.getElementById('chapter-title').innerText = `Манга: ${mangaSlug} | Глава ${chapterNum}`;

        const container = document.getElementById('reader-container');
        const status = document.getElementById('status');

        async function loadManga() {
            try {
                // Здесь ты подключаешь API манги (например, MangaLib или свой сервер).
                // Для примера используем массив тестовых картинок страниц:
                const pages = [
                    "https://via.placeholder.com/800x1200/1a1a1a/fff?text=Manga+Page+1",
                    "https://via.placeholder.com/800x1200/222222/fff?text=Manga+Page+2",
                    "https://via.placeholder.com/800x1200/2a2a2a/fff?text=Manga+Page+3"
                ];

                status.remove(); // Убираем плашку загрузки

                pages.forEach(imgUrl => {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.className = 'manga-page';
                    img.loading = 'lazy'; // Оптимизация: картинки грузятся по мере прокрутки
                    container.appendChild(img);
                });

            } catch (err) {
                status.innerText = "Не удалось загрузить главы.";
            }
        }

        loadManga();
    </script>
</body>
</html>
